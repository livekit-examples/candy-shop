[project]
name = "candy-shop-demo"
version = "0.1.0"
description = "Candy-shop robot demo: an SO-101-on-a-slider (leslider) driven over LiveKit Portal by a voice agent."
requires-python = ">=3.12,<3.13"   # livekit-portal ships cp312 wheels only
dependencies = [
    "livekit-portal>=0.2.4",
    "livekit-api>=0.7",
    "livekit>=1.1.8",
    "lerobot[feetech,smolvla,dataset]==0.6.1",
    "lerobot_robot_so101_slider",
    "lerobot_teleoperator_so101_with_slider",
    "pynput>=1.7",          # teleoperator leader: arrow keys drive slider.vel
    "torch>=2.2",
    "torchvision",
    "numpy>=1.24",
    "python-dotenv>=1",
    "opencv-python>=4.7",   # lerobot cameras + move_to ArUco (cv2.aruco) + debug windows
    "pyyaml>=6",            # move_to safe_zone.yaml
    "imgui-bundle>=1.92",   # teleoperator review UI (bundled glfw/OpenGL backend)
]

[project.scripts]
robot = "robot.run:cli"
move-to = "operators.move_to.run:cli"
move-to-calibrate = "operators.move_to.calibrate:main"
move-to-debug = "operators.move_to.debug_move_to:cli"
policy = "operators.policy.run:cli"
policy-debug = "operators.policy.debug_policy:cli"
policy-train = "operators.policy.train:cli"
reward = "operators.reward.run:cli"
reward-debug = "operators.reward.debug_reward:cli"
teleoperator = "operators.teleoperator.run:cli"
teleoperator-ui = "operators.teleoperator.ui.app:cli"

[dependency-groups]
# Training-only slice for operators/policy/skypilot.yaml: no serial/HID, camera or UI
# deps, so a GPU box installs neither feetech nor imgui.
train = [
    "lerobot[smolvla,dataset]==0.6.1",
    "torch>=2.2",
    "torchvision",
    "numpy>=1.24",
    "python-dotenv>=1",
    "livekit-api>=0.7",   # train.py -> shared.common.load_env imports livekit.api
]
# operators/policy/skypilot_pi0.yaml: pi0 is PaliGemma 2B + a 300M action expert and
# needs the `pi` extra on top of the shared training stack.
train-pi0 = [
    { include-group = "train" },
    "lerobot[pi]==0.6.1",
]
# operators/policy/skypilot_dit.yaml: multi_task_dit pulls CLIP vision+text encoders
# through transformers, which the pi/smolvla extras do not bring in.
train-dit = [
    { include-group = "train" },
    "lerobot[multi_task_dit]==0.6.1",
]
# operators/reward/skypilot.yaml: SARM's encoding processor imports faker (and the
# rest of the sarm extra) at construction, so reward training needs it on top of
# the shared training stack. matplotlib is not part of that extra but sits at the top
# of lerobot's compute_rabc_weights as an unconditional import, so scoring a dataset
# for RABC (operators/policy/skypilot_pi05.yaml) dies without it.
train-reward = [
    { include-group = "train" },
    "lerobot[sarm]==0.6.1",
    "matplotlib",
]

[[tool.uv.index]]
# Consulted only for packages that reference it below (torch/torchvision).
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot_robot_so101_slider = { git = "https://github.com/pham-tuan-binh/leslider", subdirectory = "packages/lerobot_robot_so101_slider"}
lerobot_teleoperator_so101_with_slider = { git = "https://github.com/pham-tuan-binh/leslider", subdirectory = "packages/lerobot_teleoperator_so101_with_slider"}
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true   # leslider packages are git direct references

[tool.hatch.build.targets.wheel]
packages = ["robot", "shared", "operators"]
