# Fine-tune pi0.5 on the candy-shop dataset — 8x H100, following the LeRobot folding
# recipe (https://huggingface.co/spaces/lerobot/robot-folding).
#
#   sky launch -c pi05 operators/policy/skypilot_pi05.yaml
#
# Why pi0.5 and not pi0: the folding blog's pi0.5 baseline actually *lost* to pi0
# (20% vs 40% total success) until relative actions were switched on, after which it
# led every subsequent experiment. pi0.5 is pretrained with relative actions, so
# absolute-action fine-tuning fights the pretraining. The two go together: take
# neither or both. USE_RELATIVE_ACTIONS=false is not a supported configuration here.
#
# WEIGHTS AND DATA COME FROM THE BUCKET, NOT THE HUB. Nebius has no route to the AWS
# ranges behind us.aws.cdn.hf.co (15.236.0.0/15) or cas-server.xethub.hf.co
# (54.211.x) — TCP SYN to :443 times out — so any instance that draws a public IP in
# 195.242.28.0/22 cannot fetch from the Hub at all, while 89.169.120.0/21 works fine.
# Same subnet, same security group, same route table; only the prefix differs. Rather
# than gamble on the allocation, both artifacts are staged in the bucket:
#   s3://candy-shop/base_models/pi05_base   (from a good-egress host)
#   s3://candy-shop/datasets/candy-shop     (from the pi0 box, which had it cached)
# See shared/lerobot_patches.require_pretrained_weights for why a failed fetch must
# never be allowed to reach lerobot: it swallows the error and trains from noise.
name: pi05-candy-finetune

workdir: .

resources:
  accelerators: H100:8
  disk_size: 1024   # GB: staged weights + dataset + 8 ranks of in-flight checkpoints

envs:
  CHECKPOINT_BUCKET: candy-shop
  RUN_NAME: pi05-candy
  DATASET_REPO_ID: binhpham/candy-shop

  # Bucket-staged inputs, copied to instance disk in `run` before anything reads them.
  BASE_SRC: /outputs/base_models/pi05_base
  DATASET_SRC: /outputs/datasets/candy-shop
  SARM_SRC: /outputs/sarm-candy-v2/checkpoints/012000/pretrained_model

  # Per *process*, not global: lerobot multiplies by accelerate's num_processes and
  # logs "Effective batch size: 32 x 8 = 256", which is the folding blog's figure.
  # Measured 9.5 GB/80 GB with expert-only + gradient checkpointing, so there is room
  # to raise this — but 256 effective is the number the recipe is validated at.
  BATCH_SIZE: 32
  NUM_PROCESSES: 8

  # 92,941 frames / 256 effective = 363 steps per epoch. The blog's curated-data stage
  # ran ~8 epochs and its initial stage ~3.6; our dataset is ~34x smaller than theirs,
  # so step counts do not transfer — epochs do. 6000 steps is ~16.5 epochs, deliberately
  # past the point of diminishing returns because SAVE_FREQ gives 12 checkpoints to
  # choose from and the SARM run showed quality peaking early then degrading.
  STEPS: 6000
  SAVE_FREQ: 500

  # 4 per rank x 8 ranks = 32 dataloader workers. The reward run already hit shm limits
  # at 8 workers on one process; do not raise this without checking /dev/shm.
  NUM_WORKERS: 4

  # Which parameters train. The folding blog freezes *only* the SigLIP vision encoder
  # and trains the Gemma backbone with the action expert — lerobot defaults both flags
  # to false, i.e. trains everything including the encoder, so the article-faithful
  # setting must be passed explicitly. train_expert_only=true is the cheaper control:
  # 3.67 s/step measured vs ~13 s/step for the full backbone at batch 32.
  FREEZE_ARGS: "--policy.freeze_vision_encoder true"

  # kappa 0.0215 is the blog's best (experiments 1.7 and 2.5); lerobot defaults to 0.01.
  # Their RABC failures (1.4, 1.5) came from scoring the full dataset with a SARM trained
  # only on a curated subset, which down-weighted valid data. Ours is trained on this
  # same dataset, so that mismatch does not apply.
  RABC_KAPPA: "0.0215"

  # chunk_size must match policy.chunk_size or the relative-action stats describe a
  # different horizon than training uses. 50 at 30 fps is 1.67 s (the blog used 30 at
  # 30 fps, i.e. 1.0 s) — worth revisiting, but changing it means recomputing stats.
  CHUNK_SIZE: 50

  VIDEO_BACKEND: torchcodec
  # pi05_base was pretrained on openpi's camera names; ours are overhead/arm. The third
  # slot (right_wrist) is simply not supplied and modeling_pi05 pads it.
  RENAME_MAP: '{"observation.images.overhead_camera": "observation.images.base_0_rgb", "observation.images.arm_camera": "observation.images.left_wrist_0_rgb"}'
  EXTRA_ARGS: ""

file_mounts:
  /outputs:
    source: nebius://${CHECKPOINT_BUCKET}
    mode: MOUNT_CACHED

setup: |
  sudo apt-get update -y
  sudo apt-get install -y python3-dev libevdev-dev ffmpeg \
    libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
  pip install uv --quiet
  # matplotlib is imported unconditionally at the top of lerobot's
  # compute_rabc_weights, so the RABC prep step below dies on import without it.
  uv sync --only-group train-pi0
  uv pip install matplotlib

run: |
  set -euo pipefail
  nvidia-smi

  export HF_HOME=~/.cache/huggingface
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  # Belt and braces: nothing here should need the Hub, but if something does, keep it
  # off the Xet path whose CAS server is unroutable from this VPC.
  export HF_HUB_DISABLE_XET=1

  # Stage onto instance disk. The bucket mount is fine for sequential checkpoint writes
  # but not for the random reads of a training dataloader, and recompute_stats rewrites
  # stats.json in place, which we do not want to do to the shared copy.
  mkdir -p ~/models ~/data
  cp -r "$BASE_SRC" ~/models/pi05_base
  cp -r "$DATASET_SRC" ~/data/candy-shop
  cp -r "$SARM_SRC" ~/models/sarm

  # Relative-action stats OVERWRITE stats[ACTION] under the same key (dataset_tools.py
  # :1679) — there is no separate namespace, so nothing downstream can tell absolute
  # stats from relative ones, and training with the wrong pair silently normalizes with
  # the wrong mean/std. That is also why this runs on the local copy only: the bucket
  # copy stays absolute so the pi0 serving path keeps working.
  uv run --only-group train-pi0 lerobot-edit-dataset \
    --repo_id "$DATASET_REPO_ID" \
    --root ~/data/candy-shop \
    --new_repo_id "$DATASET_REPO_ID" \
    --new_root ~/data/candy-shop \
    --operation.type recompute_stats \
    --operation.relative_action true \
    --operation.chunk_size "$CHUNK_SIZE"

  # Per-timestep SARM progress, which RABC differences into the training weights.
  #
  # Calling compute_sarm_progress directly rather than the module's own CLI: that CLI
  # declares --push-to-hub as store_true with default=True, so the flag cannot be turned
  # off, and it ends by unconditionally api.upload_file()-ing the parquet to the dataset
  # repo with no try/except. Unattended that either aborts the run (no token) or pushes
  # to the Hub repo unasked. The library function does the same computation and stops at
  # writing the file. dataset_repo_id takes a local path.
  uv run --only-group train-pi0 python -c "
  from lerobot.rewards.sarm.compute_rabc_weights import compute_sarm_progress
  import os
  compute_sarm_progress(
      dataset_repo_id=os.path.expanduser('~/data/candy-shop'),
      reward_model_path=os.path.expanduser('~/models/sarm'),
      output_path=os.path.expanduser('~/data/rabc_progress.parquet'),
      head_mode='sparse',
      device='cuda',
      num_visualizations=0,
  )
  "

  uv run --only-group train-pi0 accelerate launch \
    --multi_gpu --num_processes "$NUM_PROCESSES" \
    -m operators.policy.train_fast \
    --policy.path ~/models/pi05_base \
    --policy.dtype bfloat16 \
    --policy.push_to_hub false \
    --policy.use_relative_actions true \
    --policy.gradient_checkpointing true \
    --policy.chunk_size "$CHUNK_SIZE" \
    ${FREEZE_ARGS} \
    --dataset.repo_id "$DATASET_REPO_ID" \
    --dataset.root ~/data/candy-shop \
    --dataset.video_backend "$VIDEO_BACKEND" \
    --sample_weighting.type rabc \
    --sample_weighting.progress_path ~/data/rabc_progress.parquet \
    --sample_weighting.kappa "$RABC_KAPPA" \
    --rename_map "$RENAME_MAP" \
    --output_dir "/outputs/$RUN_NAME" \
    --job_name "$RUN_NAME" \
    --batch_size "$BATCH_SIZE" \
    --steps "$STEPS" \
    --save_freq "$SAVE_FREQ" \
    --num_workers "$NUM_WORKERS" \
    --wandb.enable false \
    ${EXTRA_ARGS:-}
