# Train the multitask DiT policy on candy-shop — 8x H100.
#
#   sky launch -c dit operators/policy/skypilot_dit.yaml
#   sky launch -c ditfm operators/policy/skypilot_dit.yaml --env OBJECTIVE_ARGS="..."
#
# Why this and not pi0.5: the arm picks the wrong candy. Five of our tasks differ only
# by the instruction ("pick up a twix" vs "pick up a nerd"), and a language probe on the
# pi0.5 checkpoints showed the prompt moving the predicted actions only 1.7x above the
# model's own sampling noise (8.75 vs 5.15 units) -- present but too weak to steer.
# Both pi0.5 configurations we trained freeze the CLIP-equivalent vision tower outright
# (train_expert_only) or degrade when it is unfrozen, so neither can learn what a Twix
# wrapper looks like in this scene. multi_task_dit trains its vision encoder at 0.1x LR
# while keeping CLIP's language semantics, which is the missing piece.
#
# lerobot's own docs list our exact failure under "Executing the Wrong Task" and
# "Multiple similar tasks", so this is a known-hard case rather than a misconfiguration:
# https://huggingface.co/docs/lerobot/en/multi_task_dit
#
# ABSOLUTE ACTIONS. Unlike pi0.5 this has no relative-action processing, so it trains on
# the absolute-stats copies (candy-train-abs / candy-holdout-abs), not the -rel ones.
name: dit-candy

workdir: .

# Nebius offers H100 and H200 in 1 or 8 only (no 4), and 8xH100 in eu-north1 failed to
# provision on three of six attempts today. H200 and B200 are the same 8-GPU shape, so
# the recipe is identical on any of them -- let SkyPilot take whichever has capacity
# rather than queueing behind the most contended one.
# Single GPU, because 8-GPU nodes in eu-north1 are exhausted and waiting cost more than
# the batch size is worth. Pinned to eu-north1: the Nebius project and candy-shop bucket
# are both there, and an unpinned launch found H200:8 in eu-west1 only to die with
# "No project found for region".
resources:
  any_of:
    - accelerators: H100:1
      region: eu-north1
      disk_size: 512
    - accelerators: H200:1
      region: eu-north1
      disk_size: 512

envs:
  CHECKPOINT_BUCKET: candy-shop
  RUN_NAME: dit-candy
  DATASET_SRC: /outputs/datasets/candy-train-abs
  DATASET_REPO_ID: binhpham/candy-shop-train

  # One process, so this IS the effective batch. lerobot's trainer has no gradient
  # accumulation, so a single GPU cannot reach the recommended 256-320: CLIP encodes
  # 2 cameras x 2 obs steps = 4 images per sample. Measured at batch 96 the run used
  # 43 of 80 GB; ~7 GB of that is fixed (weights + Adam + grads for ~450M params), so
  # activations cost ~0.375 GB/sample and 160 lands near 67 GB with margin. Still under
  # the recommended 256, which remains the argument for an 8-GPU node when one frees.
  BATCH_SIZE: 160
  NUM_PROCESSES: 1

  # Their LIBERO run was 100k steps x batch 320 = 32M samples over a large multi-task
  # suite, i.e. tens of epochs. Copying the step count instead of the epoch count is the
  # same error as porting the folding blog's 200k pi0.5 steps: 60k x 160 here would be
  # 9.6M samples over 83,405 frames = 115 epochs, several times their reference. 30k is
  # ~58 epochs, inside their range. Eval every 2500 steps decides where to actually stop.
  STEPS: 30000
  SAVE_FREQ: 2500
  EVAL_STEPS: 2500
  EVAL_SPLIT: "0.05"

  # ~1.0 s and ~0.8 s at 30 fps, straight from the docs. Both are called out as
  # parameters the model is "very sensitive" to, so they are the first thing to tune if
  # the motion is poor but the target is right.
  HORIZON: 32
  N_ACTION_STEPS: 24

  # LIBERO's multitask capacity (8/768/12), not the single-task default (6/512/8): we
  # have five tasks that must be told apart, which is a conditioning problem more than a
  # trajectory one.
  NUM_LAYERS: 8
  HIDDEN_DIM: 768
  NUM_HEADS: 12

  # base-patch16 rather than large-patch14 on one GPU: L/14 is ~304M against B/16's
  # ~86M, and spending that memory on the encoder would force the batch below the
  # documented minimum. B/16 is also what their published LIBERO result (90.6%) used.
  # The cost is brand recognition -- which is exactly what the descriptive-instruction
  # arm compensates for, by giving CLIP colour words it already grounds.
  VISION_ENCODER: openai/clip-vit-base-patch16
  TEXT_ENCODER: openai/clip-vit-base-patch16

  # Docs' LR for the LIBERO run; the default 2e-5 is for the small single-task config.
  # Tuning range they give is 1e-5 to 3e-4.
  LR: "3e-4"

  # Diffusion is the objective their published 90.6% LIBERO result used. Override for
  # the flow-matching arm; beta timestep sampling is their recommendation there
  # ("performance appears much better in practice").
  OBJECTIVE_ARGS: "--policy.objective=diffusion --policy.noise_scheduler_type=DDPM --policy.num_train_timesteps=100"

  # Geometric and luminance augmentation only. The LIBERO example also jitters hue and
  # saturation, which would be actively harmful here: our four candies are told apart
  # largely by wrapper colour (Nerds purple, KitKat red, Twix gold, Snickers brown), so
  # perturbing hue attacks the one feature the task depends on.
  IMAGE_TFS: '{"brightness":{"type":"ColorJitter","kwargs":{"brightness":[0.8,1.2]}},"contrast":{"type":"ColorJitter","kwargs":{"contrast":[0.7,1.3]}},"sharpness":{"type":"SharpnessJitter","kwargs":{"sharpness":[0.6,1.4]}},"rotation":{"type":"RandomRotation","kwargs":{"degrees":[-5,5]}},"translation":{"type":"RandomAffine","kwargs":{"degrees":0,"translate":[0.1,0.1]}}}'

  NUM_WORKERS: 12
  EXTRA_ARGS: ""

file_mounts:
  /outputs:
    source: nebius://${CHECKPOINT_BUCKET}
    mode: MOUNT_CACHED

setup: |
  sudo apt-get update -y
  sudo apt-get install -y python3-dev ffmpeg \
    libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev
  pip install uv --quiet
  uv sync --only-group train-dit

run: |
  set -euo pipefail
  nvidia-smi
  export HF_HOME=~/.cache/huggingface
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export HF_HUB_DISABLE_XET=1

  mkdir -p ~/data
  rm -rf ~/data/candy-train
  cp -r "$DATASET_SRC" ~/data/candy-train

  uv run --only-group train-dit python -m operators.policy.train_fast \
    --policy.type=multi_task_dit \
    --policy.device=cuda \
    --policy.push_to_hub=false \
    --policy.horizon="$HORIZON" \
    --policy.n_action_steps="$N_ACTION_STEPS" \
    --policy.n_obs_steps=2 \
    --policy.num_layers="$NUM_LAYERS" \
    --policy.hidden_dim="$HIDDEN_DIM" \
    --policy.num_heads="$NUM_HEADS" \
    --policy.use_rope=true \
    --policy.use_positional_encoding=false \
    --policy.vision_encoder_name="$VISION_ENCODER" \
    --policy.text_encoder_name="$TEXT_ENCODER" \
    --policy.vision_encoder_lr_multiplier=0.1 \
    --policy.use_separate_rgb_encoder_per_camera=false \
    --policy.image_resize_shape="[256,256]" \
    --policy.image_crop_shape="[224,224]" \
    --policy.image_crop_is_random=true \
    --policy.optimizer_lr="$LR" \
    --policy.optimizer_weight_decay=0 \
    --policy.scheduler_warmup_steps=0 \
    --policy.use_amp=true \
    ${OBJECTIVE_ARGS} \
    --dataset.repo_id="$DATASET_REPO_ID" \
    --dataset.root="$HOME/data/candy-train" \
    --dataset.video_backend=torchcodec \
    --dataset.image_transforms.enable=true \
    --dataset.image_transforms.max_num_transforms=3 \
    --dataset.image_transforms.tfs="$IMAGE_TFS" \
    --dataset.eval_split="$EVAL_SPLIT" \
    --eval_steps="$EVAL_STEPS" \
    --output_dir="/outputs/$RUN_NAME" \
    --job_name="$RUN_NAME" \
    --batch_size="$BATCH_SIZE" \
    --steps="$STEPS" \
    --save_freq="$SAVE_FREQ" \
    --num_workers="$NUM_WORKERS" \
    --wandb.enable=false \
    ${EXTRA_ARGS:-}
