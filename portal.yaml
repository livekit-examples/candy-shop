# Wire contract shared by robot.py, teleoperator.py, and every operator
# (policies/<algo>/inference.py, move_to, etc.).
#
# Loaded via `RobotConfig.from_yaml_file(...)` and
# `OperatorConfig.from_yaml_file(...)`. Identity (session, role) is supplied
# at the call site so the same file is reusable across all processes.
#
# Hardware = leslider: an SO-101 arm mounted on a linear slider. The six arm
# motors are position-controlled normalized `.pos`; the slider's STS3215 runs
# in VELOCITY mode. The slider is reported and commanded as `slider.vel` in
# raw ticks/s (sign-magnitude; +/- for the two travel directions, 0 = stop).
# There is no absolute slider position on the wire — placement is closed-loop
# from vision (see operators/move_to: an overhead ArUco marker + PID).
#
# State and action are intentionally lean (7 fields, no motor currents).
# Add `*.current` fields to both schemas if you want them, robot.py
# reads them only when its config flips `read_current=True`.

version: 1

# Portal exposes no getter for this, so the processes read their own tick rate
# from shared/config.py — change both together.
fps: 30

# When a state sample arrives at the operator's synchronizer with no
# fresh frame inside the sync window, reuse the last good frame instead
# of dropping the state. We want every robot tick to land in the
# dataset; a transient camera drop should not punch a hole in the
# trajectory. The reused frame is at most a couple of ticks old.
reuse_stale_frames: true

# Operators receive the executed action stream over the wire. The
# teleoperator needs this to record actions tagged with the correct
# Action.sender during HITL handoff; the policies don't strictly need
# it but pay a negligible bandwidth cost for being consistent.
action_subscription: true

# Two cameras matches the standard leslider rig (arm-mounted + overhead).
# Each algo's training may ablate one (see policies/<algo>/train.py).
#
# Codec choice matters for training data quality:
#   mjpeg (default below): per-frame JPEG, frame-independent decode, no
#     inter-frame prediction artifacts. Tuneable via `quality` (1..100).
#     90 is near-lossless on natural images at ~10x compression.
#   h264: WebRTC media path. Lowest end-to-end latency at scale, but
#     inter-frame prediction artifacts degrade as training material.
#   png: lossless byte-stream. ~2-3x compression. Use when bit-exact
#     frames are required.
#   raw: uncompressed RGB24. Largest payload; rarely justified.
videos:
  - { name: arm_camera,      codec: h264 }
  - { name: overhead_camera, codec: h264 }

# 6 arm motor positions + slider velocity (raw ticks/s).
state:
  - { name: shoulder_pan.pos,  dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos,    dtype: f32 }
  - { name: wrist_flex.pos,    dtype: f32 }
  - { name: wrist_roll.pos,    dtype: f32 }
  - { name: gripper.pos,       dtype: f32 }
  - { name: slider.vel,        dtype: f32 }

# Action mirrors state: 6 arm `.pos` goals + a slider velocity command.
# The move_to operator holds the arm (mirroring observed `.pos`) and drives
# `slider.vel` from its PID; a lerobot policy emits the same shape per tick.
action:
  - { name: shoulder_pan.pos,  dtype: f32 }
  - { name: shoulder_lift.pos, dtype: f32 }
  - { name: elbow_flex.pos,    dtype: f32 }
  - { name: wrist_flex.pos,    dtype: f32 }
  - { name: wrist_roll.pos,    dtype: f32 }
  - { name: gripper.pos,       dtype: f32 }
  - { name: slider.vel,        dtype: f32 }
